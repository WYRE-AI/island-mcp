services:
  # Gateway mode. The API key arrives per request on X-Island-Api-Key
  # (optional X-Island-Base-URL). Do not set ISLAND_API_KEY, ISLAND_BASE_URL,
  # or env_file here — that would put static vendor credentials in the
  # container. The project .env is used only for Compose interpolation of
  # CONDUIT_S2S_SECRET. For AUTH_MODE=env, pass ISLAND_API_KEY on that
  # process instead (see the README).
  island-mcp:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - MCP_TRANSPORT=http
      - MCP_HTTP_PORT=8080
      - MCP_HTTP_HOST=0.0.0.0
      - AUTH_MODE=gateway
      - CONDUIT_S2S_SECRET=${CONDUIT_S2S_SECRET:?set CONDUIT_S2S_SECRET}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
